name: Schilling Interiors storefront checks

on:
  pull_request:
    branches: [master]
    paths:
      - "storefront/**"
      - ".github/workflows/storefront.yml"
  push:
    branches: [master]
    paths:
      - "storefront/**"
      - ".github/workflows/storefront.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schilling-interiors-storefront-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: storefront
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Test storefront logic
        run: npm test
      - name: Check JavaScript syntax
        run: npm run check
      - name: Validate SQL migration
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(":memory:")
          for migration in sorted(Path("migrations").glob("*.sql")):
              db.executescript(migration.read_text())
          expected = {"products", "orders", "order_items", "stripe_events"}
          actual = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          missing = expected - actual
          if missing:
              raise SystemExit(f"Missing migration tables: {sorted(missing)}")
          columns = {row[1] for row in db.execute("PRAGMA table_info(orders)")}
          required = {"fulfillment_status", "tracking_carrier", "tracking_number", "tracking_url", "shipped_at", "fulfilled_at", "refund_status", "refund_id", "refund_amount_cents"}
          if required - columns:
              raise SystemExit(f"Missing fulfillment columns: {sorted(required - columns)}")
          print("D1 migrations and fulfillment schema validated with SQLite.")
          PY
