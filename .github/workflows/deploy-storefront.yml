name: Deploy storefront

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schilling-interiors-storefront-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: storefront-production
    defaults:
      run:
        working-directory: storefront
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_SHIPPING_RATE_ID: ${{ secrets.STRIPE_SHIPPING_RATE_ID }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          PUBLIC_STORE_URL: ${{ vars.PUBLIC_STORE_URL }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          SHIPPING_ALLOWED_COUNTRIES: ${{ vars.SHIPPING_ALLOWED_COUNTRIES }}
          STORE_SHIPPING_FULFILLMENT_CONFIRMED: ${{ vars.STORE_SHIPPING_FULFILLMENT_CONFIRMED }}
          STORE_RETURNS_PRIVACY_POLICIES_CONFIRMED: ${{ vars.STORE_RETURNS_PRIVACY_POLICIES_CONFIRMED }}
          STORE_BACKUP_RESTORE_VERIFIED: ${{ vars.STORE_BACKUP_RESTORE_VERIFIED }}
          STORE_END_TO_END_ACCEPTANCE_CONFIRMED: ${{ vars.STORE_END_TO_END_ACCEPTANCE_CONFIRMED }}
          STORE_CHECKOUT_ENABLED: ${{ vars.STORE_CHECKOUT_ENABLED }}
          STORE_DEPLOYMENT_APPROVED: ${{ vars.STORE_DEPLOYMENT_APPROVED }}
          STORE_RELEASE_APPROVED: ${{ vars.STORE_RELEASE_APPROVED }}
          STORE_POLICIES_CONFIRMED: ${{ vars.STORE_POLICIES_CONFIRMED }}
          TAX_CONFIGURATION_CONFIRMED: ${{ vars.TAX_CONFIGURATION_CONFIRMED }}
          STRIPE_AUTOMATIC_TAX: ${{ vars.STRIPE_AUTOMATIC_TAX }}
        run: |
          set -euo pipefail
          required=(CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_D1_DATABASE_ID ADMIN_API_TOKEN PUBLIC_STORE_URL SHIPPING_ALLOWED_COUNTRIES STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET STRIPE_SHIPPING_RATE_ID TURNSTILE_SECRET_KEY TURNSTILE_SITE_KEY)
          for key in "${required[@]}"; do
            if [[ -z "${!key:-}" ]]; then echo "Missing required GitHub secret/variable: $key" >&2; exit 1; fi
          done
          if [[ "${STORE_DEPLOYMENT_APPROVED:-}" != "true" || "${STORE_RELEASE_APPROVED:-}" != "true" ]]; then
            echo "Production deployment is blocked until the owner explicitly approves the complete store release and deployment gates." >&2
            exit 1
          fi
          release_gates=(STORE_POLICIES_CONFIRMED TAX_CONFIGURATION_CONFIRMED STORE_RETURNS_PRIVACY_POLICIES_CONFIRMED STORE_SHIPPING_FULFILLMENT_CONFIRMED STORE_BACKUP_RESTORE_VERIFIED STORE_END_TO_END_ACCEPTANCE_CONFIRMED)
          for key in "${release_gates[@]}"; do
            if [[ "${!key:-}" != "true" ]]; then
              echo "Production deployment is blocked until the owner explicitly confirms $key." >&2
              exit 1
            fi
          done
          if [[ "${#ADMIN_API_TOKEN}" -lt 32 ]]; then echo "ADMIN_API_TOKEN must be at least 32 characters." >&2; exit 1; fi
          if [[ "$PUBLIC_STORE_URL" != https://* ]]; then echo "PUBLIC_STORE_URL must be the final HTTPS storefront URL." >&2; exit 1; fi
          if [[ "$STRIPE_SECRET_KEY" != sk_test_* ]]; then
            echo "A Stripe test-mode secret key (sk_test_) is required; live keys are never accepted." >&2
            exit 1
          fi
          if [[ "$STORE_CHECKOUT_ENABLED" == "true" ]]; then
            payment_required=(STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET STRIPE_SHIPPING_RATE_ID TURNSTILE_SECRET_KEY TURNSTILE_SITE_KEY)
            for key in "${payment_required[@]}"; do
              if [[ -z "${!key:-}" ]]; then echo "Checkout launch is missing: $key" >&2; exit 1; fi
            done
            if [[ "$STORE_POLICIES_CONFIRMED" != "true" || "$TAX_CONFIGURATION_CONFIRMED" != "true" ]]; then
              echo "Checkout requires confirmed policies and tax configuration. Keep checkout disabled until the business owner has reviewed them." >&2; exit 1
            fi
          fi
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const config = JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8"));
          config.d1_databases[0].database_id = process.env.CLOUDFLARE_D1_DATABASE_ID;
          config.vars.PUBLIC_STORE_URL = process.env.PUBLIC_STORE_URL;
          config.vars.TURNSTILE_SITE_KEY = process.env.TURNSTILE_SITE_KEY || "";
          config.vars.STORE_CHECKOUT_ENABLED = process.env.STORE_CHECKOUT_ENABLED === "true" ? "true" : "false";
          config.vars.STORE_RELEASE_APPROVED = process.env.STORE_RELEASE_APPROVED === "true" ? "true" : "false";
          config.vars.STORE_POLICIES_CONFIRMED = process.env.STORE_POLICIES_CONFIRMED === "true" ? "true" : "false";
          config.vars.TAX_CONFIGURATION_CONFIRMED = process.env.TAX_CONFIGURATION_CONFIRMED === "true" ? "true" : "false";
          config.vars.STRIPE_AUTOMATIC_TAX = process.env.STRIPE_AUTOMATIC_TAX === "true" ? "true" : "false";
          config.vars.SHIPPING_ALLOWED_COUNTRIES = process.env.SHIPPING_ALLOWED_COUNTRIES;
          fs.writeFileSync("wrangler.deploy.jsonc", JSON.stringify(config, null, 2));
          NODE
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6.0.0
        with:
          node-version: 24
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.48.0 d1 migrations apply schilling-interiors-store --remote --yes --config wrangler.deploy.jsonc
      - name: Store configured Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_SHIPPING_RATE_ID: ${{ secrets.STRIPE_SHIPPING_RATE_ID }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
        run: |
          set -euo pipefail
          for key in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET STRIPE_SHIPPING_RATE_ID TURNSTILE_SECRET_KEY ADMIN_API_TOKEN; do
            if [[ -n "${!key:-}" ]]; then printf '%s' "${!key}" | npx --yes wrangler@4.48.0 secret put "$key" --config wrangler.deploy.jsonc; fi
          done
      - name: Deploy Worker and storefront assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.48.0 deploy --config wrangler.deploy.jsonc
