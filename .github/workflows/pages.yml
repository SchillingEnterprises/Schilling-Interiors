name: Schilling Interiors Pages

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schilling-interiors-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate archive and interactions
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate HTML structure, local links, and privacy regressions
        run: python -m unittest discover -s tests -v
      - name: Check JavaScript syntax
        run: node --check scripts/js/index.js
      - name: Test navigation interactions
        run: node --test tests/navigation.test.cjs
      - name: Stage only the approved public website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for page in index.html 404.html robots.txt; do
            test -f "$page"
            cp "$page" dist/
          done
          for directory in html styles scripts; do
            test -d "$directory"
            cp -R "$directory" dist/
          done
          test -f dist/index.html
          test -f dist/html/Alynn-Neckwear.html
          test -f dist/html/Toss-Designs.html
          test -f dist/styles/css/style.css
          test -f dist/scripts/js/index.js
          test ! -e dist/.github
          test ! -e dist/tests
          test ! -e dist/README.md
          if find dist -type f \\( -name '*.py' -o -name '*.sqlite3' -o -name '.env' \\) -print -quit | grep -q .; then
            echo "Unexpected source, database, or environment file in Pages artifact." >&2
            exit 1
          fi
      - name: Upload approved Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
